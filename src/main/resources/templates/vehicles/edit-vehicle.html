<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editare Masina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h3>Editeaza Masina</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/vehicles/update}" th:object="${vehicle}" method="post">

                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Numar Inmatriculare (car_plate):</label>
                    <input type="text" th:field="*{licensePlate}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Model (car_name):</label>
                    <input type="text" th:field="*{model}" class="form-control" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Culoare:</label>
                    <input type="text" th:field="*{color}" class="form-control" required />
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Salveaza Modificarile</button>
                    <a th:href="@{/vehicles}" class="btn btn-secondary">Anuleaza</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
