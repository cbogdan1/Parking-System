<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editare Rezervare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark"><h3>Editeaza Rezervarea</h3></div>
        <div class="card-body">
            <form th:action="@{/reservations/update}" th:object="${reservation}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label">Alege Masina:</label>
                    <select th:field="*{vehicle.id}" class="form-select" required>
                        <option th:each="v : ${allVehicles}" th:value="${v.id}"
                                th:text="${v.licensePlate + ' - ' + v.model}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Alege Locul:</label>
                    <select th:field="*{parkingSpot.id}" class="form-select" required>
                        <option th:each="s : ${allSpots}" th:value="${s.id}"
                                th:text="${s.spotSection + ' (Pret: ' + s.pricePerHour + ')'}"></option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Data Start:</label>
                        <input type="datetime-local" th:field="*{startTime}" class="form-control" required />
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Data Final:</label>
                        <input type="datetime-local" th:field="*{endTime}" class="form-control" required />
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salveaza Modificarile</button>
                    <a th:href="@{/reservations}" class="btn btn-secondary">Anuleaza</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
