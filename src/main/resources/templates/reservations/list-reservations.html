<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rezervari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between mb-3">
        <h2>Rezervari Active</h2>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addReservationModal">Rezerva Acum</button>
    </div>

    <table class="table table-white table-striped shadow-sm">
        <thead>
        <tr>
            <th>ID</th>
            <th>Masina</th>
            <th>Loc</th>
            <th>Interval</th>
            <th>Cost</th>
            <th>Actiuni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="res : ${reservations}">
            <td th:text="${res.id}"></td>
            <td>
                <span th:text="${res.vehicle?.licensePlate ?: 'Fara Masina'}"></span> -
                <span th:text="${res.vehicle?.model ?: 'N/A'}"></span>
            </td>
            <td th:text="${res.parkingSpot?.spotSection ?: 'Loc Sters'}"></td>
            <td>
                <span th:if="${res.startTime != null}" th:text="${#temporals.format(res.startTime, 'dd-MM HH:mm')}"></span>
                /
                <span th:if="${res.endTime != null}" th:text="${#temporals.format(res.endTime, 'dd-MM HH:mm')}"></span>
            </td>
            <td th:text="${res.totalCost + ' RON'}"></td>
            <td>
                <a th:href="@{/reservations/delete/{id}(id=${res.id})}" class="btn btn-sm btn-danger">Sterge</a>
                <a th:href="@{/reservations/edit/{id}(id=${res.id})}" class="btn btn-sm btn-warning">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div th:replace="~{fragments/reservation-modal :: div}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
