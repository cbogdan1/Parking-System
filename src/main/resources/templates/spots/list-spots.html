<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestiune Locuri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Configurare Locuri Parcare</h2>
        <button class="btn btn-success shadow-sm" data-bs-toggle="modal" data-bs-target="#addSpotModal">
            + Adauga Loc Nou
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Numar Loc</th>
                    <th>Pret / Ora</th>
                    <th>Status</th>
                    <th>Actiuni</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${spots}">
                    <td th:text="${s.id}"></td>
                    <td th:text="${s.spotNumber}" class="fw-bold"></td>
                    <td th:text="${s.pricePerHour + ' RON'}"></td>
                    <td>
                        <span th:if="${s.occupied}" class="badge bg-danger">Ocupat</span>
                        <span th:if="${!s.occupied}" class="badge bg-success">Liber</span>
                    </td>
                    <td>
                        <a th:href="@{/spots/delete/{id}(id=${s.id})}"class="btn btn-sm btn-danger">Sterge</a>
                        <a th:href="@{/spots/edit/{id}(id=${s.id})}" class="btn btn-sm btn-warning">Edit</a>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${#lists.isEmpty(spots)}" class="text-center py-3">
                <p class="text-muted">Nu exista locuri de parcare configurate. Adauga unul folosind butonul de mai sus.</p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/spot-modal :: div}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
